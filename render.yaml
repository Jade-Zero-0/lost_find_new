services:
  - type: web
    name: ai-lost-found
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    # 说明：免费套餐无持久盘，业务数据改存 MongoDB Atlas 免费层（重启/重新部署不丢）。
    # 上传图片仍是容器本地文件，重启后会从仓库 backend/uploads 重新填充种子图片。
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      # 构建期跳过 mongodb-memory-server 下载 MongoDB 二进制（仅本地测试用，生产不需要）
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # 数据层驱动：mongo = 连接 MongoDB Atlas；改回 json 可秒回退到本地文件
      - key: DB_DRIVER
        value: mongo
      # Atlas 连接串（含账号密码，敏感）：在 Render 面板手动填写，不写进仓库
      - key: MONGODB_URI
        sync: false
      # 数据库名（可选，默认 ai_lost_found）
      - key: MONGODB_DB
        value: ai_lost_found
      - key: AI_PROVIDER
        value: mock
      - key: GLM_API_KEY
        value: ""
      - key: AI_FALLBACK_TO_MOCK
        value: "true"
      - key: VITE_API_BASE_URL
        value: ""