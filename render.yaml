services:
  - type: web
    name: ai-lost-found
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    # 持久化磁盘：JSON 数据与上传图片都写在这里，重启/重新部署不丢数据
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      # 数据目录指向持久盘；首次启动会从仓库 database/ 填充种子数据
      - key: DATA_DIR
        value: /data
      # 上传图片目录也放持久盘
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: AI_PROVIDER
        value: mock
      - key: GLM_API_KEY
        value: ""
      - key: AI_FALLBACK_TO_MOCK
        value: "true"
      - key: VITE_API_BASE_URL
        value: ""