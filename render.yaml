services:
  - type: web
    name: ai-lost-found
    runtime: node
    region: singapore
    plan: free
    # 显式安装 devDependencies：NODE_ENV=production 下 npm install 默认跳过 dev，
    # 而前端构建工具 vite 属于 devDependency，故用 --include=dev 确保能构建。
    # 先清 lockfile/node_modules：规避 npm optional 依赖 bug(npm/cli#4828)，
    # 否则 Tailwind v4 的原生模块 @tailwindcss/oxide 会漏装导致构建失败。
    buildCommand: rm -rf node_modules package-lock.json backend/package-lock.json && npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    # 说明：免费套餐无持久盘，业务数据改存 MongoDB Atlas 免费层（重启/重新部署不丢）。
    # 上传图片改存 Cloudflare R2 对象存储（配齐 R2_* 变量即生效，跨部署持久，永不丢图）；
    # 未配置 R2 时回退容器本地文件，重启后从仓库 backend/uploads 重新填充种子图片。
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      # 构建期跳过 mongodb-memory-server 下载 MongoDB 二进制（仅本地测试用，生产不需要）
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # 数据层驱动：mongo = 连接 MongoDB Atlas；改回 json 可秒回退到本地文件
      - key: DB_DRIVER
        value: mongo
      # Atlas 连接串（含账号密码，敏感）：在 Render 面板手动填写，不写进仓库
      - key: MONGODB_URI
        sync: false
      # 数据库名（可选，默认 ai_lost_found）
      - key: MONGODB_DB
        value: ai_lost_found
      - key: AI_PROVIDER
        value: mock
      - key: GLM_API_KEY
        value: ""
      - key: AI_FALLBACK_TO_MOCK
        value: "true"
      # ---- 图片云存储 Cloudflare R2（配齐即生效，未配置则回退本地文件）----
      # 敏感项以 sync:false 在 Render 面板手填，不写进仓库
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: VITE_API_BASE_URL
        value: ""